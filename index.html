<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrenman Zamanlayıcı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Ekran geçişlerinin yumuşak olması için arka plan rengi geçiş efekti */
            transition: background-color 0.5s ease;
        }
        
        /* Sayacın ekranı tamamen kaplaması ve ortalanması için */
        .full-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }

        /* Zaman göstergesinin devasa ve responsive olması için özel sınıf */
        .timer-text {
            font-size: clamp(6rem, 25vw, 15rem);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Rakamların sabit genişlikte olmasını sağlar, titremeyi önler */
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body id="app-body" class="bg-slate-900 text-white full-center selection:bg-indigo-500">

    <!-- ANA EKRAN (AYARLAR) -->
    <div id="setup-screen" class="w-full max-w-md p-6 bg-slate-800/50 backdrop-blur rounded-3xl shadow-2xl border border-slate-700 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Interval Timer</h1>
            <p class="text-slate-400 text-sm">Antrenman ve dinlenme sürelerinizi ayarlayın</p>
        </div>

        <div class="space-y-6">
            <!-- Egzersiz Süresi Girişi -->
            <div>
                <label for="work-time" class="block text-sm font-medium text-slate-300 mb-2">Egzersiz Süresi (saniye)</label>
                <input type="number" id="work-time" value="20" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-center font-semibold">
            </div>

            <!-- Dinlenme Süresi Girişi -->
            <div>
                <label for="rest-time" class="block text-sm font-medium text-slate-300 mb-2">Dinlenme Süresi (saniye)</label>
                <input type="number" id="rest-time" value="40" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all text-center font-semibold">
            </div>

            <!-- Set Sayısı Girişi -->
            <div>
                <label for="sets" class="block text-sm font-medium text-slate-300 mb-2">Set Sayısı</label>
                <input type="number" id="sets" value="10" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-center font-semibold">
            </div>

            <!-- Başla Butonu -->
            <button id="start-btn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 text-xl mt-4">
                Başla
            </button>
        </div>
    </div>

    <!-- ZAMANLAYICI EKRANI (Başlangıçta Gizli) -->
    <div id="timer-screen" class="hidden w-full h-full full-center px-4 relative">
        <!-- Durum Bildirimi (Egzersiz, Dinlenme, Bitti) -->
        <div id="phase-display" class="text-4xl md:text-6xl font-bold uppercase tracking-widest mb-4 drop-shadow-md">
            Hazırlan
        </div>
        
        <!-- Geri Sayım Rakamı -->
        <div id="time-display" class="timer-text mb-6">
            --
        </div>
        
        <!-- Set Takipçisi -->
        <div id="set-display" class="text-xl md:text-3xl font-medium bg-black/20 px-6 py-2 rounded-full backdrop-blur">
            Set: 1 / 10
        </div>

        <!-- İptal Butonu (Ekranın Altında) -->
        <button id="cancel-btn" class="absolute bottom-10 px-8 py-3 bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors font-medium backdrop-blur">
            Vazgeç
        </button>
    </div>

    <script>
        // DOM Elementlerini Seçme
        const appBody = document.getElementById('app-body');
        const setupScreen = document.getElementById('setup-screen');
        const timerScreen = document.getElementById('timer-screen');
        
        const workInput = document.getElementById('work-time');
        const restInput = document.getElementById('rest-time');
        const setsInput = document.getElementById('sets');
        const startBtn = document.getElementById('start-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        
        const phaseDisplay = document.getElementById('phase-display');
        const timeDisplay = document.getElementById('time-display');
        const setDisplay = document.getElementById('set-display');

        // Uygulama Değişkenleri
        let workDuration = 20;
        let restDuration = 40;
        let totalSets = 10;
        
        let currentSet = 1;
        let timeRemaining = 0;
        let timerInterval = null;
        
        // Olası Durumlar: 'PREPARE', 'WORK', 'REST', 'DONE'
        let currentState = 'PREPARE'; 

        // Renk Paleti (Tailwind sınıfları)
        const colors = {
            setup: 'bg-slate-900',
            work: 'bg-emerald-600',
            rest: 'bg-sky-600',
            done: 'bg-amber-500'
        };

        // ==========================================
        // SES SİSTEMİ (Web Audio API)
        // ==========================================
        let audioCtx;

        function initAudio() {
            // Audio context'i kullanıcı etkileşimi ile başlatmak zorundayız (tarayıcı politikaları)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Basit bir "bip" sesi oluşturan fonksiyon
        function playTone(frequency, duration, type = 'sine') {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Sesi yumuşak başlatıp bitirme (patlama sesini engeller)
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playTick() {
            // Son 3 saniye geri sayım ince bip
            playTone(600, 0.1, 'sine');
        }

        function playPhaseChange(isWork) {
            // Faz değişiminde daha belirgin bip (Egzersiz için yüksek, dinlenme için düşük frekans)
            if (isWork) {
                playTone(880, 0.4, 'square'); // La notası, egzersiz başla
            } else {
                playTone(440, 0.4, 'triangle'); // Dinlenme
            }
        }

        function playDone() {
            // Bitiş melodisi (ardışık notalar)
            playTone(523.25, 0.2, 'square'); // Do
            setTimeout(() => playTone(659.25, 0.2, 'square'), 200); // Mi
            setTimeout(() => playTone(783.99, 0.4, 'square'), 400); // Sol
        }

        // ==========================================
        // ZAMANLAYICI MANTIĞI
        // ==========================================

        // Arka plan rengini değiştirir
        function changeBackground(colorClass) {
            // Mevcut renk sınıflarını temizle
            Object.values(colors).forEach(c => appBody.classList.remove(c));
            // Yeni rengi ekle
            appBody.classList.add(colorClass);
        }

        // Ekrana formatlanmış zamanı yazar
        function formatTime(seconds) {
            // Dakika gerekirse diye, ama basit tutmak adına saniye bazlı gösterim (örn: 65, 40)
            // İsterseniz MM:SS için burayı güncelleyebilirsiniz. Şimdilik düz saniye.
            return seconds.toString(); 
        }

        // Ana ekrandan zamanlayıcıya geçiş
        function startTimer() {
            // Ses sistemini tetikle
            initAudio();

            // Değerleri Oku ve Doğrula
            workDuration = parseInt(workInput.value) || 20;
            restDuration = parseInt(restInput.value) || 40;
            totalSets = parseInt(setsInput.value) || 10;

            if (workDuration < 1) workDuration = 1;
            if (restDuration < 1) restDuration = 1;
            if (totalSets < 1) totalSets = 1;

            // Değişkenleri Sıfırla
            currentSet = 1;
            currentState = 'PREPARE'; // 3 saniyelik hazırlık süresi ekleyelim
            timeRemaining = 3;

            // Ekranları Değiştir
            setupScreen.classList.add('hidden');
            timerScreen.classList.remove('hidden');
            timerScreen.classList.add('flex'); // full-center class içindeki flex yapısını korumak için

            // İlk Ekran Güncellemesi
            updateUI();

            // Sayacı Başlat
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        // Her 1 saniyede çalışan fonksiyon
        function tick() {
            timeRemaining--;

            // Geri sayım sesleri (Son 3 saniye)
            if (timeRemaining > 0 && timeRemaining <= 3) {
                playTick();
            }

            if (timeRemaining < 0) {
                // Aşama Değişimi
                switchPhase();
            } else {
                // Sadece ekranı güncelle
                updateUI();
            }
        }

        // Egzersiz, Dinlenme veya Bitiş durumları arası geçiş
        function switchPhase() {
            if (currentState === 'PREPARE') {
                // Hazırlık bitti, egzersize geç
                startWorkPhase();
            } 
            else if (currentState === 'WORK') {
                // Egzersiz bitti. Son set mi kontrol et.
                if (currentSet >= totalSets) {
                    finishWorkout();
                } else {
                    // Son set değilse dinlenmeye geç
                    startRestPhase();
                }
            } 
            else if (currentState === 'REST') {
                // Dinlenme bitti, yeni sete geç
                currentSet++;
                startWorkPhase();
            }
            updateUI();
        }

        function startWorkPhase() {
            currentState = 'WORK';
            timeRemaining = workDuration;
            playPhaseChange(true);
        }

        function startRestPhase() {
            currentState = 'REST';
            timeRemaining = restDuration;
            playPhaseChange(false);
        }

        // Tüm setler bittiğinde
        function finishWorkout() {
            currentState = 'DONE';
            timeRemaining = 0;
            clearInterval(timerInterval);
            playDone();
            updateUI();

            // 4 saniye sonra ana ekrana dön
            setTimeout(() => {
                resetToSetup();
            }, 4000);
        }

        // Ekrandaki yazıları ve renkleri günceller
        function updateUI() {
            setDisplay.textContent = `Set: ${currentSet} / ${totalSets}`;
            
            if (currentState === 'PREPARE') {
                phaseDisplay.textContent = 'HAZIRLAN';
                timeDisplay.textContent = formatTime(timeRemaining);
                changeBackground(colors.setup);
            } 
            else if (currentState === 'WORK') {
                phaseDisplay.textContent = 'EGZERSİZ';
                timeDisplay.textContent = formatTime(timeRemaining);
                changeBackground(colors.work);
            } 
            else if (currentState === 'REST') {
                phaseDisplay.textContent = 'DİNLENME';
                timeDisplay.textContent = formatTime(timeRemaining);
                changeBackground(colors.rest);
            } 
            else if (currentState === 'DONE') {
                phaseDisplay.textContent = 'BİTTİ!';
                timeDisplay.textContent = '🎉';
                changeBackground(colors.done);
            }
        }

        // Ana ekrana geri dönme fonksiyonu (İptal edildiğinde veya bittiğinde)
        function resetToSetup() {
            clearInterval(timerInterval);
            timerScreen.classList.add('hidden');
            timerScreen.classList.remove('flex');
            setupScreen.classList.remove('hidden');
            changeBackground(colors.setup);
        }

        // ==========================================
        // OLAY DİNLEYİCİLERİ (EVENT LISTENERS)
        // ==========================================
        startBtn.addEventListener('click', startTimer);
        cancelBtn.addEventListener('click', resetToSetup);

    </script>
</body>
</html>
