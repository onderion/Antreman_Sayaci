<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrenman Sayacı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center font-sans antialiased">
       <!-- ANA EKRAN (AYARLAR) -->
    <div id="setup-screen" class="w-full max-w-md p-6 bg-slate-800/50 backdrop-blur rounded-3xl shadow-2xl border border-slate-700 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Interval Timer</h1>
            <p class="text-slate-400 text-sm">Antrenman ve dinlenme sürelerinizi ayarlayın</p>
        </div>

        <div class="space-y-6">
            <!-- Egzersiz Süresi Girişi -->
            <div>
                <label for="work-time" class="block text-sm font-medium text-slate-300 mb-2">Egzersiz Süresi (saniye)</label>
                <input type="number" id="workTime" value="20" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-center font-semibold">
            </div>

            <!-- Dinlenme Süresi Girişi -->
            <div>
                <label for="rest-time" class="block text-sm font-medium text-slate-300 mb-2">Dinlenme Süresi (saniye)</label>
                <input type="number" id="restTime" value="40" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all text-center font-semibold">
            </div>

            <!-- Set Sayısı Girişi -->
            <div>
                <label for="sets" class="block text-sm font-medium text-slate-300 mb-2">Set Sayısı</label>
                <input type="number" id="sets" value="10" min="1" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-center font-semibold">
            </div>

            <!-- Başla Butonu -->
             <button onclick="startApp()"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 text-xl mt-4">
                BAŞLA
            </button>
        </div>
    </div>
    <!-- Sayaç Ekranı -->
    <div id="timer" class="hidden flex-col items-center justify-center w-full h-screen transition-colors duration-500">
        <div id="status" class="text-4xl md:text-6xl font-extrabold uppercase tracking-widest mb-4 opacity-90 drop-shadow-md">HAZIRLAN</div>
        <div id="time" class="text-9xl md:text-[12rem] font-black tabular-nums drop-shadow-lg mb-2 transition-opacity duration-300">3</div>
        <div id="setInfo" class="text-2xl md:text-3xl font-semibold opacity-80 mb-12">Set: 1 / 3</div>
        
        <!-- Butonlar -->
        <div class="flex gap-4">
            <button id="pauseBtn" onclick="pauseTimer()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-4 px-8 rounded-full text-xl transition shadow-lg flex items-center justify-center min-w-[140px]">Durdur</button>
            <button id="resumeBtn" onclick="resumeTimer()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-8 rounded-full text-xl transition shadow-lg flex items-center justify-center min-w-[140px]">Devam Et</button>
            <button onclick="resetApp()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-full text-xl transition shadow-lg flex items-center justify-center min-w-[140px]">Vazgeç</button>
        </div>
    </div>

    <script>
        let workTime, restTime, totalSets;
        let currentPhase = 'prep'; 
        let currentSec = 3;
        let currentSet = 1;
        let interval = null;
        let audioCtx = null;

        const setupUI = document.getElementById('setup');
        const timerUI = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const timeEl = document.getElementById('time');
        const setInfoEl = document.getElementById('setInfo');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');

        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'work') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'rest') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'done') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1046, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        function startApp() {
            workTime = parseInt(document.getElementById('workTime').value);
            restTime = parseInt(document.getElementById('restTime').value);
            totalSets = parseInt(document.getElementById('sets').value);
            
            if(workTime <= 0 || restTime <= 0 || totalSets <= 0) return alert("Lütfen geçerli değerler girin.");

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            setupUI.classList.add('hidden');
            timerUI.classList.remove('hidden');
            timerUI.classList.add('flex');
            
            currentPhase = 'prep';
            currentSec = 3;
            currentSet = 1;
            
            updateDisplay();
            setPhaseColor();
            
            resumeBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            timeEl.classList.remove('opacity-40');
            
            interval = setInterval(tick, 1000);
        }

        function pauseTimer() {
            clearInterval(interval);
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            timeEl.classList.add('opacity-40'); 
        }

        function resumeTimer() {
            timeEl.classList.remove('opacity-40');
            pauseBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
            interval = setInterval(tick, 1000);
        }

        function resetApp() {
            clearInterval(interval);
            timerUI.classList.add('hidden');
            timerUI.classList.remove('flex');
            setupUI.classList.remove('hidden');
            document.body.className = "bg-gray-900 text-white min-h-screen flex items-center justify-center font-sans antialiased";
        }

        function tick() {
            currentSec--;
            
            if (currentSec <= 3 && currentSec > 0) playSound('tick');

            if (currentSec < 0) {
                switchPhase();
            } else {
                updateDisplay();
            }
        }

        function switchPhase() {
            if (currentPhase === 'prep') {
                currentPhase = 'work';
                currentSec = workTime;
                playSound('work');
            } else if (currentPhase === 'work') {
                if (currentSet >= totalSets) {
                    finishWorkout();
                    return;
                }
                currentPhase = 'rest';
                currentSec = restTime;
                playSound('rest');
            } else if (currentPhase === 'rest') {
                currentSet++;
                currentPhase = 'work';
                currentSec = workTime;
                playSound('work');
            }
            setPhaseColor();
            updateDisplay();
        }

        function finishWorkout() {
            clearInterval(interval);
            playSound('done');
            statusEl.innerText = "BİTTİ! 🎉";
            timeEl.innerText = "0";
            setInfoEl.innerText = "Tebrikler!";
            document.body.className = "bg-purple-600 text-white min-h-screen flex flex-col items-center justify-center font-sans antialiased transition-colors duration-500";
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            
            setTimeout(resetApp, 4000);
        }

        function updateDisplay() {
            timeEl.innerText = currentSec;
            setInfoEl.innerText = `Set: ${currentSet} / ${totalSets}`;
            
            if (currentPhase === 'prep') statusEl.innerText = "HAZIRLAN";
            else if (currentPhase === 'work') statusEl.innerText = "EGZERSİZ";
            else if (currentPhase === 'rest') statusEl.innerText = "DİNLENME";
        }

        function setPhaseColor() {
            let baseClasses = "text-white min-h-screen flex flex-col items-center justify-center font-sans antialiased transition-colors duration-500 ";
            if (currentPhase === 'prep') document.body.className = baseClasses + "bg-yellow-600";
            else if (currentPhase === 'work') document.body.className = baseClasses + "bg-emerald-600";
            else if (currentPhase === 'rest') document.body.className = baseClasses + "bg-blue-600";
        }
    </script>
</body>
</html>
